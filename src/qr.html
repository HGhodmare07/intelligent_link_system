<!DOCTYPE html>
<html>
<head>
  <title>QR Code</title>
</head>
<body>

  <h1>Your QR Code</h1>

  <img id="qr" alt="QR Code">

  <script>
    fetch('/api/urls/2/qr')
      .then(response => response.json())
      .then(data => {
        document.getElementById('qr').src = data.qrCode;
      })
      .catch(error => {
        console.error('Error:', error);
      });
  </script>

</body>
</html>
